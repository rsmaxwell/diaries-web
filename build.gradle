import java.nio.charset.StandardCharsets
import java.time.LocalDateTime
import java.time.format.DateTimeFormatter

plugins {
    id 'application'
    id 'jacoco'
    alias(libs.plugins.shadow)
}

group = 'com.rsmaxwell.diaries'
version = providers.gradleProperty('projectVersion')
    .getOrElse('0.1.0-SNAPSHOT')

def webMainClass = 'com.rsmaxwell.diaries.web.DiariesWeb'
def webProjectDirectory = projectDir
def webProjectVersion = version.toString()

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation libs.javalin
    implementation libs.pebble
    implementation libs.jackson.databind
    implementation libs.commons.cli
    implementation libs.org.eclipse.paho.mqttv5.client
    implementation libs.owasp.html.sanitizer
    implementation libs.slf4j.api

    runtimeOnly libs.log4j.slf4j2.impl
    runtimeOnly libs.log4j.core
    runtimeOnly libs.log4j.api

    testImplementation libs.junit.jupiter
    testImplementation libs.assertj.core
    testImplementation libs.awaitility
    testImplementation libs.testcontainers
    testImplementation libs.testcontainers.junit.jupiter
    testRuntimeOnly libs.junit.platform.launcher
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-parameters']
}

def runGitCommand = { List<String> arguments ->
    try {
        def process = new ProcessBuilder(['git'] + arguments)
            .directory(webProjectDirectory)
            .redirectErrorStream(true)
            .start()
        def output = process.inputStream
            .getText(StandardCharsets.UTF_8.name())
            .trim()
        return process.waitFor() == 0 ? output : ''
    } catch (Exception ignored) {
        return ''
    }
}

def generatedBuildInfoDirectory =
    layout.buildDirectory.dir('generated/resources/buildInfo')
def generatedBuildInfoFile = generatedBuildInfoDirectory.map {
    it.file('build-info.properties')
}

sourceSets.main.resources.srcDir generatedBuildInfoDirectory

tasks.register('generateBuildInfo') {
    group = 'build'
    description = 'Generates diaries-web build information.'
    outputs.file generatedBuildInfoFile
    outputs.upToDateWhen { false }

    doLast {
        def outputFile = generatedBuildInfoFile.get().asFile
        outputFile.parentFile.mkdirs()

        def properties = new Properties()
        properties.setProperty('name', 'diaries-web')
        properties.setProperty('version', webProjectVersion)
        properties.setProperty('buildId', System.getenv('BUILD_ID') ?: '(none)')
        properties.setProperty(
            'buildDate',
            System.getenv('BUILD_TIMESTAMP')
                ?: LocalDateTime.now().format(
                    DateTimeFormatter.ofPattern('yyyy-MM-dd HH:mm:ss')
                )
        )
        properties.setProperty(
            'gitCommit',
            System.getenv('GIT_COMMIT')
                ?: runGitCommand(['rev-parse', 'HEAD'])
                ?: '(none)'
        )
        properties.setProperty(
            'gitBranch',
            System.getenv('GIT_BRANCH')
                ?: runGitCommand(['rev-parse', '--abbrev-ref', 'HEAD'])
                ?: '(none)'
        )
        properties.setProperty(
            'gitUrl',
            System.getenv('GIT_URL')
                ?: runGitCommand(['config', '--get', 'remote.origin.url'])
                ?: '(none)'
        )

        outputFile.withOutputStream {
            properties.store(it, 'Generated by Gradle - do not edit')
        }
    }
}

tasks.named('processResources') {
    dependsOn tasks.named('generateBuildInfo')
}

application {
    mainClass = webMainClass
}

tasks.named('run') {
    workingDir = rootProject.projectDir
}

tasks.named('jar') {
    archiveBaseName.set('diaries-web')
    archiveClassifier.set('')
    manifest {
        attributes(
            'Main-Class': webMainClass,
            'Implementation-Title': 'diaries-web',
            'Implementation-Version': project.version
        )
    }
}

tasks.named('shadowJar') {
    archiveBaseName.set('diaries-web')
    archiveClassifier.set('fat')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    filesMatching(['META-INF/services/**', 'META-INF/*.kotlin_module']) {
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
    }
    mergeServiceFiles()
    manifest {
        attributes(
            'Main-Class': webMainClass,
            'Implementation-Title': 'diaries-web',
            'Implementation-Version': project.version
        )
    }
}

tasks.named('assemble') {
    dependsOn tasks.named('shadowJar')
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport')
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.register('runSyntheticSite', JavaExec) {
    group = 'verification'
    description = 'Runs a synthetic read-only site on http://127.0.0.1:18082 for browser smoke tests.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.rsmaxwell.diaries.web.SyntheticSiteMain'
}
